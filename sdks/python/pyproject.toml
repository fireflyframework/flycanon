[project]
name = "flycanon-sdk"
version = "26.10.6"
description = "Async-first Python client for the flycanon Operational Knowledge Repository service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Firefly Software Foundation" },
]
keywords = ["flycanon", "knowledge", "rag", "fireflyframework", "firefly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/fireflyframework/flycanon"
Documentation = "https://github.com/fireflyframework/flycanon/tree/main/sdks/python"
Source = "https://github.com/fireflyframework/flycanon"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flycanon_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

# 26.5.7 unification adds typed exception classes whose names mirror
# the service's RFC 7807 ``code`` field (e.g. ``MissingAgentToken``
# for ``code=missing_agent_token``). Forcing an ``Error`` suffix
# breaks that 1:1 mapping with the wire contract.
[tool.ruff.lint.per-file-ignores]
"src/flycanon_sdk/_errors.py" = ["N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
